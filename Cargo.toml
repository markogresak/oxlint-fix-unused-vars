[workspace]
members = [".", "napi"]
resolver = "2"

[package]
name = "oxlint-fix-unused-vars"
version = "0.1.2"
edition = "2021"
rust-version = "1.95"
authors = ["Marko Gresak <marko@gresak.io>"]
description = "Remove unused TypeScript and JavaScript bindings with Oxlint's no-unused-vars analysis."
license = "MIT"
readme = "README.md"
repository = "https://github.com/markogresak/oxlint-fix-unused-vars"
homepage = "https://github.com/markogresak/oxlint-fix-unused-vars"
keywords = ["javascript", "typescript", "lint", "unused", "oxlint"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
lazy-regex = "3"
oxc_allocator = "=0.141.0"
oxc_ast = "=0.141.0"
oxc_diagnostics = "=0.141.0"
oxc_parser = "=0.141.0"
oxc_semantic = { version = "=0.141.0", features = ["linter"] }
oxc_span = "=0.141.0"
oxc_syntax = "=0.141.0"
rayon = "1"
rustc-hash = "2"
