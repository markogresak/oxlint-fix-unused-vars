name: Release NPM Package

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - npm/oxlint-fix-unused-vars/package.json # Please only commit this file, so we don't need to wait for test CI to pass.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.version }}
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Check version changes
        uses: EndBug/version-check@v2
        id: version
        with:
          static-checking: localIsNew
          file-url: https://unpkg.com/oxlint-fix-unused-vars@latest/package.json
          file-name: npm/oxlint-fix-unused-vars/package.json

      - name: Set version name
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "Version change found! New version: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.version_type }})"
          echo "version=${{ steps.version.outputs.version }}" >> $GITHUB_ENV

  build:
    needs: check
    if: needs.check.outputs.version_changed == 'true'
    env:
      version: ${{ needs.check.outputs.version }}
    outputs:
      version: ${{ env.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64-gnu
            use-cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64-gnu
            use-cross: true

          - os: macos-14 # M1
            target: aarch64-apple-darwin
            code-target: darwin-arm64
            use-cross: false

          - os: macos-14
            target: x86_64-apple-darwin
            code-target: darwin-x64
            use-cross: false

    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Build with cross
        if: matrix.use-cross
        run: cross build --release -p oxlint-fix-unused-vars-napi --target=${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.use-cross }} # macOS runners have no container engine for `cross`; both Apple targets cross-compile natively via the Xcode toolchain
        run: cargo build --release -p oxlint-fix-unused-vars-napi --target=${{ matrix.target }}

      - name: Move file on ${{ matrix.os }}
        run: |
          shopt -s extglob
          ls target/${{ matrix.target }}/release/*.@(so|dll|dylib)
          mv target/${{ matrix.target }}/release/*.@(so|dll|dylib) npm/oxlint-fix-unused-vars/oxlint-fix-unused-vars.${{ matrix.code-target }}.node
          ls npm/oxlint-fix-unused-vars

      - name: Test
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' }} # only host-runnable binaries: no docker for Linux aarch64, no Rosetta assumed for darwin x64
        run: node --test napi/test/remove-unused-vars.spec.mjs

      # The binary is zipped to fix permission loss https://github.com/actions/upload-artifact#permission-loss
      - name: Archive Binary
        if: runner.os == 'Windows'
        run: 7z a ${{ matrix.code-target }}.zip npm/oxlint-fix-unused-vars/oxlint-fix-unused-vars.${{ matrix.code-target }}.node

      # The binary is zipped to fix permission loss https://github.com/actions/upload-artifact#permission-loss
      - name: Archive Binary
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.code-target }}.tar.gz npm/oxlint-fix-unused-vars/oxlint-fix-unused-vars.${{ matrix.code-target }}.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: binaries-${{ matrix.code-target }}
          path: |
            *.zip
            *.tar.gz

  publish:
    name: Publish NAPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - build
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Unzip
        run: |
          shopt -s nullglob
          for archive in *.zip; do unzip -qq -o "$archive" -d .; done

      - name: Untar
        run: ls *.gz | xargs -I {} tar xvf {}

      - name: Create npm dirs
        run: pnpm exec napi create-npm-dirs --package-json-path npm/oxlint-fix-unused-vars/package.json --npm-dir npm

      - name: Move artifacts into npm dirs
        run: pnpm exec napi artifacts --package-json-path npm/oxlint-fix-unused-vars/package.json --npm-dir npm --output-dir npm/oxlint-fix-unused-vars

      - name: Inject optionalDependencies
        # --tag-style npm avoids `pre-publish`'s default lerna commit-message parsing (this repo
        # doesn't use lerna-style release commits); --no-gh-release skips creating a GH release,
        # which we don't have a token wired up for here.
        run: pnpm exec napi pre-publish --package-json-path npm/oxlint-fix-unused-vars/package.json --npm-dir npm --skip-optional-publish --tag-style npm --no-gh-release

      - name: Show generated packages
        run: |
          cat npm/oxlint-fix-unused-vars/package.json
          for package in npm/*/
          do
            ls "$package"
            cat "$package/package.json"
            echo '----'
          done

      - name: Generate .npmrc
        run: echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc

      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # NOTE: The trailing slash on $package/ changes it to publishing the directory
        run: |
          cp README.md LICENSE npm/oxlint-fix-unused-vars/
          # publish platform subpackages first
          for package in npm/*/
          do
            [ "$package" = "npm/oxlint-fix-unused-vars/" ] && continue
            npm publish "$package" --provenance --access public
          done
          # publish root package last
          npm publish npm/oxlint-fix-unused-vars/ --provenance --access public
